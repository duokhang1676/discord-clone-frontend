<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - Dương Khang Room</title>
  <link rel="stylesheet" href="auth-style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <h1>🎤 Dương Khang Room</h1>
        <p>Tạo tài khoản mới</p>
      </div>

      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Chọn username (ít nhất 3 ký tự)"
            required
            minlength="3"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Chọn password (ít nhất 6 ký tự)"
            required
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label for="confirm-password">Xác nhận Password</label>
          <input 
            type="password" 
            id="confirm-password" 
            name="confirm-password" 
            placeholder="Nhập lại password"
            required
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <div id="error-message" class="error-message"></div>

        <button type="submit" class="auth-button" id="register-btn">
          <span class="btn-text">Đăng ký</span>
          <span class="btn-loader" style="display: none;">Đang xử lý...</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
      </div>
    </div>
  </div>

  <script>
    const registerForm = document.getElementById('register-form');
    const errorMessage = document.getElementById('error-message');
    const registerBtn = document.getElementById('register-btn');
    const btnText = registerBtn.querySelector('.btn-text');
    const btnLoader = registerBtn.querySelector('.btn-loader');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      
      // Clear previous error
      errorMessage.textContent = '';
      errorMessage.style.display = 'none';
      
      // Validate password match
      if (password !== confirmPassword) {
        errorMessage.textContent = 'Password và xác nhận password không khớp';
        errorMessage.style.display = 'block';
        return;
      }
      
      // Show loading
      registerBtn.disabled = true;
      btnText.style.display = 'none';
      btnLoader.style.display = 'inline';
      
      try {
        const response = await fetch('https://discord-clone-mp22.onrender.com/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          // Show success message
          alert('Đăng ký thành công! Bạn sẽ được chuyển đến trang đăng nhập.');
          
          // Redirect to login page
          window.location.href = 'login.html';
        } else {
          // Show error
          errorMessage.textContent = data.message;
          errorMessage.style.display = 'block';
        }
      } catch (error) {
        console.error('Register error:', error);
        errorMessage.textContent = 'Không thể kết nối đến server. Vui lòng thử lại sau.';
        errorMessage.style.display = 'block';
      } finally {
        // Hide loading
        registerBtn.disabled = false;
        btnText.style.display = 'inline';
        btnLoader.style.display = 'none';
      }
    });
  </script>
</body>
</html>
