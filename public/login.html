<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Dương Khang Room</title>
  <link rel="stylesheet" href="auth-style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <h1>🎤 Dương Khang Room</h1>
        <p>Đăng nhập để bắt đầu</p>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Nhập username của bạn"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Nhập password của bạn"
            required
            autocomplete="current-password"
          >
        </div>

        <div id="error-message" class="error-message"></div>

        <button type="submit" class="auth-button" id="login-btn">
          <span class="btn-text">Đăng nhập</span>
          <span class="btn-loader" style="display: none;">Đang xử lý...</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');
    const loginBtn = document.getElementById('login-btn');
    const btnText = loginBtn.querySelector('.btn-text');
    const btnLoader = loginBtn.querySelector('.btn-loader');

    // Check if already logged in
    checkAuth();

    async function checkAuth() {
      try {
        // SAFARI iOS FIX: Send session token in header
        const headers = {};
        const sessionToken = localStorage.getItem('session_token');
        if (sessionToken) {
          headers['Authorization'] = `Bearer ${sessionToken}`;
          console.log('[iOS Debug] checkAuth: Token found in localStorage');
        } else {
          console.log('[iOS Debug] checkAuth: No token in localStorage');
        }
        
        const response = await fetch('https://discord-clone-mp22.onrender.com/api/check-auth', {
          credentials: 'include',
          headers: headers
        });
        const data = await response.json();
        
        console.log('[iOS Debug] checkAuth response:', data);
        
        if (data.authenticated) {
          console.log('[iOS Debug] Already authenticated, redirecting to index.html');
          window.location.href = 'index.html';
        }
      } catch (error) {
        console.error('[iOS Debug] Auth check error:', error);
      }
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      // Clear previous error
      errorMessage.textContent = '';
      errorMessage.style.display = 'none';
      
      // Show loading
      loginBtn.disabled = true;
      btnText.style.display = 'none';
      btnLoader.style.display = 'inline';
      
      try {
        const response = await fetch('https://discord-clone-mp22.onrender.com/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        // Debug logging
        console.log('[iOS Debug] Login response status:', response.status);
        console.log('[iOS Debug] Login response data:', data);
        
        if (data.success) {
          try {
            // Store username in localStorage
            localStorage.setItem('username', data.username);
            console.log('[iOS Debug] Username saved to localStorage:', data.username);
            
            // SAFARI iOS FIX: Store session token if provided
            if (data.session_token) {
              localStorage.setItem('session_token', data.session_token);
              console.log('[iOS Debug] Session token saved to localStorage');
              
              // Verify token was saved (iOS Safari fix)
              const savedToken = localStorage.getItem('session_token');
              if (savedToken === data.session_token) {
                console.log('[iOS Debug] Token verified in localStorage');
              } else {
                console.error('[iOS Debug] Token verification failed!');
              }
            } else {
              console.warn('[iOS Debug] No session_token in response - backend may not be updated');
            }
            
            // iOS Safari fix: Add small delay to ensure localStorage is written
            console.log('[iOS Debug] Waiting for localStorage to persist...');
            await new Promise(resolve => setTimeout(resolve, 100));
            
            // Redirect to main page
            console.log('[iOS Debug] Redirecting to index.html');
            window.location.href = 'index.html';
          } catch (storageError) {
            console.error('[iOS Debug] localStorage error:', storageError);
            errorMessage.textContent = 'Lỗi lưu phiên đăng nhập. Vui lòng tắt chế độ riêng tư và thử lại.';
            errorMessage.style.display = 'block';
          }
        } else {
          // Show error
          errorMessage.textContent = data.message || 'Username hoặc password không đúng';
          errorMessage.style.display = 'block';
        }
      } catch (error) {
        console.error('[iOS Debug] Login error:', error);
        console.error('[iOS Debug] Error details:', {
          message: error.message,
          stack: error.stack,
          name: error.name
        });
        errorMessage.textContent = 'Không thể kết nối đến server. Vui lòng thử lại sau.';
        errorMessage.style.display = 'block';
      } finally {
        // Hide loading
        loginBtn.disabled = false;
        btnText.style.display = 'inline';
        btnLoader.style.display = 'none';
      }
    });
  </script>
</body>
</html>
