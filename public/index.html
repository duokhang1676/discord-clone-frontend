<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dương Khang - Discord Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Dương Khang Room</h1>
      <div class="user-info">
        <span id="your-name">Connecting...</span>
        <button id="logout-btn" class="logout-btn" style="display: none;">Đăng xuất</button>
      </div>
    </div>

    <div class="main-content">
      <div class="users-panel">
        <h2>Users Online</h2>
        <div id="user-list"></div>
      </div>

      <div class="voice-panel">
        <div class="status">
          <div id="connection-status" class="status-disconnected">
            <span class="status-dot"></span>
            <span class="status-text">Disconnected</span>
          </div>
        </div>
        
        <div class="audio-indicators">
          <div class="audio-indicator">
            <span class="indicator-icon">🎤</span>
            <div class="audio-bars">
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
            </div>
            <span class="indicator-label">Your Mic</span>
          </div>
          <div class="audio-indicator">
            <span class="indicator-icon">🔊</span>
            <div class="audio-bars remote">
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
            </div>
            <span class="indicator-label">Remote Audio</span>
          </div>
        </div>

        <div class="controls">
          <button id="mic-btn" class="control-btn active">
            <span class="icon">🎤</span>
            <span class="btn-text">Microphone On</span>
          </button>
          
          <button id="speaker-btn" class="control-btn active">
            <span class="icon">🔊</span>
            <span class="btn-text">Speaker On</span>
          </button>
          
          <button id="disconnect-btn" class="control-btn disconnect-btn" disabled>
            <span class="icon">📞</span>
            <span class="btn-text">Disconnect</span>
          </button>
        </div>
      </div>

      <div class="chat-panel">
        <div class="chat-header">
          <h3>💬 Room Chat</h3>
          <button id="clear-chat-btn" class="clear-chat-btn" title="Clear chat history">
            🗑️
          </button>
        </div>
        
        <div class="chat-messages" id="chat-messages">
          <div class="loading-messages">Loading messages...</div>
        </div>
        
        <div class="chat-input-container">
          <input type="file" id="image-input" accept="image/*" style="display: none;">
          <button id="image-btn" class="image-btn" title="Send image">
            <span>📷</span>
          </button>
          <input 
            type="text" 
            id="chat-input" 
            placeholder="Type a message..."
            maxlength="500"
            autocomplete="off"
          >
          <button id="send-btn" class="send-btn" title="Send message">
            <span>📤</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <audio id="remote-audio" autoplay></audio>

  <script>
    // Check authentication before loading
    async function checkAuth() {
      try {
        // SAFARI iOS FIX: Send session token in header
        const headers = {};
        const sessionToken = localStorage.getItem('session_token');
        const username = localStorage.getItem('username');
        
        console.log('[iOS Debug] index.html checkAuth:', {
          hasToken: !!sessionToken,
          hasUsername: !!username,
          username: username
        });
        
        if (sessionToken) {
          headers['Authorization'] = `Bearer ${sessionToken}`;
          console.log('[iOS Debug] Sending Authorization header with token');
        } else {
          console.log('[iOS Debug] No token found - will try cookie auth');
        }
        
        const response = await fetch('https://discord-clone-mp22.onrender.com/api/check-auth', {
          credentials: 'include',
          headers: headers
        });
        
        console.log('[iOS Debug] Auth response status:', response.status);
        const data = await response.json();
        console.log('[iOS Debug] Auth response data:', data);
        
        if (!data.authenticated) {
          console.log('[iOS Debug] Not authenticated, redirecting to login');
          window.location.href = 'login.html';
          return false;
        }
        
        console.log('[iOS Debug] Authentication successful');
        
        // Show logout button
        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
          logoutBtn.style.display = 'inline-block';
        }
        
        return true;
      } catch (error) {
        console.error('[iOS Debug] Auth check error:', error);
        console.error('[iOS Debug] Error details:', {
          message: error.message,
          stack: error.stack,
          name: error.name
        });
        window.location.href = 'login.html';
        return false;
      }
    }
    
    // Logout function
    async function logout() {
      try {
        console.log('[iOS Debug] Logout initiated');
        
        const headers = {};
        const sessionToken = localStorage.getItem('session_token');
        if (sessionToken) {
          headers['Authorization'] = `Bearer ${sessionToken}`;
          console.log('[iOS Debug] Sending logout with token');
        }
        
        await fetch('https://discord-clone-mp22.onrender.com/api/logout', {
          method: 'POST',
          credentials: 'include',
          headers: headers
        });
        
        console.log('[iOS Debug] Logout successful, clearing localStorage');
        localStorage.removeItem('username');
        localStorage.removeItem('session_token');
        
        console.log('[iOS Debug] Redirecting to login');
        window.location.href = 'login.html';
      } catch (error) {
        console.error('[iOS Debug] Logout error:', error);
        // Clear localStorage anyway
        try {
          localStorage.removeItem('username');
          localStorage.removeItem('session_token');
        } catch (e) {
          console.error('[iOS Debug] localStorage clear error:', e);
        }
        window.location.href = 'login.html';
      }
    }
    
    // Add logout button event listener
    document.addEventListener('DOMContentLoaded', () => {
      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', logout);
      }
    });
    
    // Check auth before proceeding
    checkAuth().then(authenticated => {
      if (authenticated) {
        console.log('[iOS Debug] Loading Socket.io script...');
        
        // Load Socket.io and main script
        const socketScript = document.createElement('script');
        socketScript.src = '/socket.io/socket.io.js';
        document.body.appendChild(socketScript);
        
        socketScript.onload = () => {
          console.log('[iOS Debug] Socket.io loaded, loading main script...');
          const mainScript = document.createElement('script');
          mainScript.src = 'script.js';
          document.body.appendChild(mainScript);
          
          mainScript.onload = () => {
            console.log('[iOS Debug] Main script loaded successfully');
          };
          
          mainScript.onerror = (error) => {
            console.error('[iOS Debug] Error loading main script:', error);
          };
        };
        
        socketScript.onerror = (error) => {
          console.error('[iOS Debug] Error loading Socket.io:', error);
        };
      } else {
        console.log('[iOS Debug] Not authenticated, not loading scripts');
      }
    }).catch(error => {
      console.error('[iOS Debug] checkAuth promise error:', error);
    });
  </script>
</body>
</html>
