<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dương Khang - Discord Clone</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .debug-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.95);
      color: #0f0;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      max-height: 200px;
      overflow-y: auto;
      border-top: 2px solid #0f0;
      z-index: 9999;
    }
    .debug-panel .log-success { color: #0f0; }
    .debug-panel .log-error { color: #f00; }
    .debug-panel .log-warning { color: #ff0; }
    .debug-panel .log-info { color: #0ff; }
    .debug-toggle {
      position: fixed;
      bottom: 210px;
      right: 10px;
      background: #000;
      color: #0f0;
      border: 2px solid #0f0;
      padding: 10px;
      cursor: pointer;
      z-index: 10000;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- Debug Panel -->
  <button class="debug-toggle" onclick="toggleDebug()">🐛 DEBUG</button>
  <div class="debug-panel" id="debug-panel"></div>
  
  <div class="container">
    <div class="header">
      <h1>Dương Khang Room</h1>
      <div class="user-info">
        <span id="your-name">Connecting...</span>
        <button id="logout-btn" class="logout-btn" style="display: none;">Đăng xuất</button>
      </div>
    </div>

    <div class="main-content">
      <div class="users-panel">
        <h2>Users Online</h2>
        <div id="user-list"></div>
      </div>

      <div class="voice-panel">
        <div class="status">
          <div id="connection-status" class="status-disconnected">
            <span class="status-dot"></span>
            <span class="status-text">Disconnected</span>
          </div>
        </div>
        
        <div class="audio-indicators">
          <div class="audio-indicator">
            <span class="indicator-icon">🎤</span>
            <div class="audio-bars">
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
            </div>
            <span class="indicator-label">Your Mic</span>
          </div>
          <div class="audio-indicator">
            <span class="indicator-icon">🔊</span>
            <div class="audio-bars remote">
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
            </div>
            <span class="indicator-label">Remote Audio</span>
          </div>
        </div>

        <div class="controls">
          <button id="mic-btn" class="control-btn active">
            <span class="icon">🎤</span>
            <span class="btn-text">Microphone On</span>
          </button>
          
          <button id="speaker-btn" class="control-btn active">
            <span class="icon">🔊</span>
            <span class="btn-text">Speaker On</span>
          </button>
          
          <button id="disconnect-btn" class="control-btn disconnect-btn" disabled>
            <span class="icon">📞</span>
            <span class="btn-text">Disconnect</span>
          </button>
        </div>
      </div>

      <div class="chat-panel">
        <div class="chat-header">
          <h3>💬 Room Chat</h3>
          <button id="clear-chat-btn" class="clear-chat-btn" title="Clear chat history">
            🗑️
          </button>
        </div>
        
        <div class="chat-messages" id="chat-messages">
          <div class="loading-messages">Loading messages...</div>
        </div>
        
        <div class="chat-input-container">
          <input type="file" id="image-input" accept="image/*" style="display: none;">
          <button id="image-btn" class="image-btn" title="Send image">
            <span>📷</span>
          </button>
          <input 
            type="text" 
            id="chat-input" 
            placeholder="Type a message..."
            maxlength="500"
            autocomplete="off"
          >
          <button id="send-btn" class="send-btn" title="Send message">
            <span>📤</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <audio id="remote-audio" autoplay></audio>

  <script>
    // Debug panel functions
    let debugLogs = [];
    let debugVisible = true;
    
    function debugLog(message, type = 'info') {
      const timestamp = new Date().toLocaleTimeString();
      const logEntry = `[${timestamp}] ${message}`;
      debugLogs.push({ message: logEntry, type });
      
      const panel = document.getElementById('debug-panel');
      if (panel) {
        const div = document.createElement('div');
        div.className = `log-${type}`;
        div.textContent = logEntry;
        panel.appendChild(div);
        panel.scrollTop = panel.scrollHeight;
      }
      
      console.log(`[${type.toUpperCase()}]`, message);
    }
    
    function toggleDebug() {
      const panel = document.getElementById('debug-panel');
      debugVisible = !debugVisible;
      panel.style.display = debugVisible ? 'block' : 'none';
    }
    
    // Show initial debug info on page load
    debugLog('🚀 index.html loaded', 'success');
    debugLog('User Agent: ' + navigator.userAgent.substring(0, 50) + '...', 'info');
    
    // Test localStorage
    try {
      const username = localStorage.getItem('username');
      const token = localStorage.getItem('session_token');
      debugLog(`Username in storage: ${username || 'NONE'}`, username ? 'success' : 'error');
      debugLog(`Token in storage: ${token ? token.substring(0, 20) + '...' : 'NONE'}`, token ? 'success' : 'error');
    } catch (e) {
      debugLog('❌ localStorage error: ' + e.message, 'error');
    }
    
    // Check authentication before loading
    async function checkAuth() {
      try {
        debugLog('🔍 Checking authentication...', 'info');
        
        // SAFARI iOS FIX: Send session token in header
        const headers = {};
        const sessionToken = localStorage.getItem('session_token');
        const username = localStorage.getItem('username');
        
        debugLog(`Has token: ${!!sessionToken}, Has username: ${!!username}`, 'info');
        
        if (sessionToken) {
          headers['Authorization'] = `Bearer ${sessionToken}`;
          debugLog('📤 Sending Authorization header', 'success');
        } else {
          debugLog('⚠️ No token - trying cookie auth', 'warning');
        }
        
        debugLog('📡 Calling /api/check-auth...', 'info');
        const response = await fetch('https://discord-clone-mp22.onrender.com/api/check-auth', {
          credentials: 'include',
          headers: headers
        });
        
        debugLog(`📥 Response status: ${response.status}`, 'info');
        const data = await response.json();
        debugLog(`📥 Response: ${JSON.stringify(data)}`, 'info');
        
        if (!data.authenticated) {
          debugLog('❌ NOT AUTHENTICATED! Redirecting to login...', 'error');
          debugLog('⚠️ This is why you got kicked out!', 'warning');
          
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 3000); // 3 second delay to read logs
          return false;
        }
        
        debugLog('✅ Authentication successful!', 'success');
        
        // Show logout button
        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
          logoutBtn.style.display = 'inline-block';
        }
        
        return true;
      } catch (error) {
        debugLog('❌ checkAuth error: ' + error.message, 'error');
        debugLog('Stack: ' + error.stack, 'error');
        
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 3000);
        return false;
      }
    }
    
    // Logout function
    async function logout() {
      try {
        debugLog('🚪 Logout initiated', 'info');
        
        const headers = {};
        const sessionToken = localStorage.getItem('session_token');
        if (sessionToken) {
          headers['Authorization'] = `Bearer ${sessionToken}`;
          debugLog('📤 Sending logout with token', 'info');
        }
        
        await fetch('https://discord-clone-mp22.onrender.com/api/logout', {
          method: 'POST',
          credentials: 'include',
          headers: headers
        });
        
        debugLog('✅ Logout successful', 'success');
        debugLog('🗑️ Clearing localStorage...', 'info');
        
        localStorage.removeItem('username');
        localStorage.removeItem('session_token');
        
        debugLog('✅ Storage cleared', 'success');
        debugLog('🔄 Redirecting to login...', 'info');
        
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1000);
      } catch (error) {
        debugLog('❌ Logout error: ' + error.message, 'error');
        // Clear localStorage anyway
        try {
          localStorage.removeItem('username');
          localStorage.removeItem('session_token');
        } catch (e) {
          debugLog('❌ Storage clear error: ' + e.message, 'error');
        }
        window.location.href = 'login.html';
      }
    }
    
    // Add logout button event listener
    document.addEventListener('DOMContentLoaded', () => {
      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', logout);
      }
    });
    
    // Check auth before proceeding
    checkAuth().then(authenticated => {
      if (authenticated) {
        debugLog('✅ Loading Socket.io script...', 'info');
        
        // Load Socket.io and main script
        const socketScript = document.createElement('script');
        socketScript.src = '/socket.io/socket.io.js';
        document.body.appendChild(socketScript);
        
        socketScript.onload = () => {
          debugLog('✅ Socket.io loaded', 'success');
          debugLog('📄 Loading main script...', 'info');
          
          const mainScript = document.createElement('script');
          mainScript.src = 'script.js';
          document.body.appendChild(mainScript);
          
          mainScript.onload = () => {
            debugLog('✅ Main script loaded successfully', 'success');
            debugLog('🎉 App fully initialized!', 'success');
          };
          
          mainScript.onerror = (error) => {
            debugLog('❌ Error loading main script: ' + error, 'error');
          };
        };
        
        socketScript.onerror = (error) => {
          debugLog('❌ Error loading Socket.io: ' + error, 'error');
        };
      } else {
        debugLog('❌ Not authenticated, not loading scripts', 'error');
      }
    }).catch(error => {
      debugLog('❌ checkAuth promise error: ' + error.message, 'error');
    });
  </script>
</body>
</html>
