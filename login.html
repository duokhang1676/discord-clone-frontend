<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Dương Khang Room</title>
  <link rel="stylesheet" href="auth-style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <h1>🎤 Dương Khang Room</h1>
        <p>Đăng nhập để bắt đầu</p>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Nhập username của bạn"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Nhập password của bạn"
            required
            autocomplete="current-password"
          >
        </div>

        <div id="error-message" class="error-message"></div>

        <button type="submit" class="auth-button" id="login-btn">
          <span class="btn-text">Đăng nhập</span>
          <span class="btn-loader" style="display: none;">Đang xử lý...</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');
    const loginBtn = document.getElementById('login-btn');
    const btnText = loginBtn.querySelector('.btn-text');
    const btnLoader = loginBtn.querySelector('.btn-loader');

    // Check if already logged in
    checkAuth();

    async function checkAuth() {
      try {
        const response = await fetch('https://discord-clone-mp22.onrender.com/api/check-auth', {
          credentials: 'include'
        });
        const data = await response.json();
        
        if (data.authenticated) {
          window.location.href = 'index.html';
        }
      } catch (error) {
        console.error('Auth check error:', error);
      }
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      // Clear previous error
      errorMessage.textContent = '';
      errorMessage.style.display = 'none';
      
      // Show loading
      loginBtn.disabled = true;
      btnText.style.display = 'none';
      btnLoader.style.display = 'inline';
      
      try {
        const response = await fetch('https://discord-clone-mp22.onrender.com/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          // Store username in localStorage
          localStorage.setItem('username', data.username);
          
          // SAFARI iOS FIX: Store session token if provided
          if (data.session_token) {
            localStorage.setItem('session_token', data.session_token);
          }
          
          // Redirect to main page
          window.location.href = 'index.html';
        } else {
          // Show error
          errorMessage.textContent = data.message;
          errorMessage.style.display = 'block';
        }
      } catch (error) {
        console.error('Login error:', error);
        errorMessage.textContent = 'Không thể kết nối đến server. Vui lòng thử lại sau.';
        errorMessage.style.display = 'block';
      } finally {
        // Hide loading
        loginBtn.disabled = false;
        btnText.style.display = 'inline';
        btnLoader.style.display = 'none';
      }
    });
  </script>
</body>
</html>
